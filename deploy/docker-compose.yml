services:
  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    environment:
      PORT: 4000
      CLIENT_ORIGIN: https://chat.bookmytrim.in
      TURN_URLS: turn:chat.bookmytrim.in:3478?transport=udp,turn:chat.bookmytrim.in:3478?transport=tcp
      TURN_USERNAME: ${TURN_USERNAME:?Set TURN_USERNAME in .env}
      TURN_CREDENTIAL: ${TURN_CREDENTIAL:?Set TURN_CREDENTIAL in .env}
    expose:
      - "4000"

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      args:
        VITE_API_URL: ""
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/active.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-www:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro

  coturn:
    image: coturn/coturn:latest
    network_mode: host
    restart: unless-stopped
    command:
      - -n
      - --log-file=stdout
      - --listening-ip=0.0.0.0
      - --listening-port=3478
      - --fingerprint
      - --lt-cred-mech
      - --realm=chat.bookmytrim.in
      - --server-name=chat.bookmytrim.in
      - --user=${TURN_USERNAME:?Set TURN_USERNAME in .env}:${TURN_CREDENTIAL:?Set TURN_CREDENTIAL in .env}
      - --min-port=49152
      - --max-port=49252
      - --external-ip=${TURN_EXTERNAL_IP:?Set TURN_EXTERNAL_IP in .env}
      - --no-cli

  certbot:
    image: certbot/certbot:latest
    profiles: ["tools"]
    volumes:
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt

volumes:
  certbot-www:
  letsencrypt:
